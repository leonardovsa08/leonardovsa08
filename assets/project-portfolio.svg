  <circle cx="62" cy="48" r="4" fill="#FEBC2E"/>
  <circle cx="76" cy="48" r="4" fill="#28C840"/>
  <rect x="92" y="42" width="244" height="12" rx="6" fill="#0A0D13"/>
  <rect x="48" y="72" width="288" height="68" rx="8" fill="url(#orange)"/>
